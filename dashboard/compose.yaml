name: n2-equipe10-redash
x-redash-env: &redash-env
  REDASH_DATABASE_URL: postgresql://redash:redash_dev_only@postgres/redash
  REDASH_REDIS_URL: redis://redis:6379/0
  REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET:?Defina REDASH_COOKIE_SECRET no .env}
  REDASH_SECRET_KEY: ${REDASH_SECRET_KEY:?Defina REDASH_SECRET_KEY no .env}
  REDASH_WEB_WORKERS: "2"
  REDASH_LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "0"

services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash_dev_only
      POSTGRES_DB: redash
    volumes:
      - redash_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash -d redash"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    image: redash/redash:10.1.0.b50633
    command: server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment: *redash-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    restart: unless-stopped
    environment:
      <<: *redash-env
      QUEUES: queries,scheduled_queries,schemas,default
      WORKERS_COUNT: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    image: redash/redash:10.1.0.b50633
    command: scheduler
    restart: unless-stopped
    environment: *redash-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mongodb_data:
  redash_postgres:
